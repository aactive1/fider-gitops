apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fider-db-credentials
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fider-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
       DATABASE_URL: 'postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@terraform-f7205b9466eba8bdc23aa0a611.cw342ceiemz4.us-east-1.rds.amazonaws.com:5432/fiderdb?sslmode=require'
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-d2ff30dc-a96b-4ba6-a342-1e77857d0567-sInZKq
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-d2ff30dc-a96b-4ba6-a342-1e77857d0567-sInZKq
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: fider/dev/jwt
        
    
