apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fider-db-credentials
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fider-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
       DATABASE_URL: 'postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@terraform-e54ade3c0ff6f1558f1b53a7d6.cw342ceiemz4.us-east-1.rds.amazonaws.com:5432/fiderdb?sslmode=require'
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-f7a9aabf-856b-4961-9d3e-6c0519dc8d38-VH5Mhn
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-f7a9aabf-856b-4961-9d3e-6c0519dc8d38-VH5Mhn
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: fider/dev/jwt
        
    