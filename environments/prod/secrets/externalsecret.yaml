apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fider-db-credentials
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fider-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-d78d1562-7d03-4442-b943-f24c2c8fb332-JoZvvB
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-d78d1562-7d03-4442-b943-f24c2c8fb332-JoZvvB
        property: password