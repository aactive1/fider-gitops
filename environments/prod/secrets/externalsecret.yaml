apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fider-db-credentials
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fider-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
       DATABASE_URL: 'postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@terraform-4cebdec11746564412a822f3d9.cw342ceiemz4.us-east-1.rds.amazonaws.com:5432/fiderdb?sslmode=require'
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-d78d1562-7d03-4442-b943-f24c2c8fb332-JoZvvB
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-d78d1562-7d03-4442-b943-f24c2c8fb332-JoZvvB
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: fider/dev/jwt
        
    