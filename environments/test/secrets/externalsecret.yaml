      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-1e00d749-59c4-412a-8c3f-681443076c5b-sZFz5j
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-1e00d749-59c4-412a-8c3f-681443076c5b-sZFz5j
        property: password