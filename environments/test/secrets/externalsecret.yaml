apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fider-db-credentials
  namespace: test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: fider-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: 'postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@terraform-cb2300b6bfd61444533624e707.cw342ceiemz4.us-east-1.rds.amazonaws.com:5432/fiderdb?sslmode=require'
  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-034048ed-cbad-40fc-ad5a-916124d1cf28-vcB8Wn
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:796951668371:secret:rds!db-034048ed-cbad-40fc-ad5a-916124d1cf28-vcB8Wn
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: fider/dev/jwt
