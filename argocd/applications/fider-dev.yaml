apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fider-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aactive1/fider-gitops
    path: helm/fider
    targetRevision: HEAD
    helm:
      valueFiles:
        - ../../environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: false
      selfHeal: true