apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fider-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aactive1/fider-gitops
    path: helm/fider
    targetRevision: HEAD
    helm:
      valueFiles:
        - ../../environments/test/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: test

  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false