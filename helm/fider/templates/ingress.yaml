apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: fider
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /signup

spec:
  ingressClassName: alb

  rules:
    - host: dev.aainfo.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fider
                port:
                  number: 3000